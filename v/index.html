<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bli vänner i StegAppen</title>
<meta name="description" content="Gå med mig i StegAppen och gå mer tillsammans! Tryck för att bli vänner.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="StegAppen">
<meta property="og:title" content="Bli vänner i StegAppen">
<meta property="og:description" content="Gå med mig och gå mer tillsammans! Tryck för att bli vänner.">
<meta property="og:image" content="https://stegappen.se/v/bild.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root { --bg:#F4F6F1; --card:#fff; --text:#1E2A22; --muted:#6B7A70; --green:#2F7D4F; --orange:#E08A2C; --soft:#DCEFE2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121714; --card:#1C231E; --text:#EEF2EC; --muted:#A3B0A7; --soft:#23402F; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width:440px; margin:0 auto; padding:48px 16px; text-align:center; }
  img.logo { width:120px; height:120px; border-radius:28px; background:#fff; }
  h1 { font-size:32px; margin:20px 0 4px; } h1 .a { color:var(--orange); } h1 .s { color:var(--green); }
  p { color:var(--muted); margin:8px 0; }
  .card { background:var(--card); border-radius:20px; padding:20px; margin:28px 0; }
  .code { font:600 30px/1 ui-monospace, Menlo, monospace; letter-spacing:4px; color:var(--green); background:var(--soft); border-radius:12px; padding:14px; margin:10px 0 18px; }
  a.btn { display:block; background:var(--green); color:#fff; text-decoration:none; font-weight:600; padding:16px; border-radius:14px; }
  small { color:var(--muted); display:block; margin-top:14px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/icon.png" alt="">
  <h1><span class="s">Steg</span><span class="a">Appen</span></h1>
  <p>Du har blivit inbjuden att bli vänner – gå mer tillsammans!</p>
  <div class="card">
    <p>Vännens ID</p>
    <div class="code" id="code">–</div>
    <a class="btn" id="open" href="stegappen://friends">Öppna StegAppen och bli vänner</a>
    <small>Har du inte appen än? StegAppen testas just nu – be den som skickade länken om en inbjudan till testet. Sedan kan du trycka på länken igen.</small>
  </div>
</main>
<script>
  var c = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  if (c) {
    document.getElementById('code').textContent = c;
    var url = 'stegappen://friends?add=' + c;
    document.getElementById('open').href = url;
    // Försök öppna appen direkt (om universella länkar inte redan gjort det)
    setTimeout(function () { location.href = url; }, 400);
  }
</script>
</body>
</html>
